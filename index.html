<script>
const GOOGLE_CLIENT_ID = "DEINE_CLIENT_ID.apps.googleusercontent.com";

<script>
/* ======================= Hilfsfunktionen ======================= */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const heute = () => new Date().toISOString().slice(0, 10);
const eur = (n) => new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format(Number.isFinite(n) ? n : 0);
const m3 = (n) => `${Number(n).toLocaleString("de-DE", { maximumFractionDigits: 2 })} m³`;
const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
function formatDatum(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
}
function googleCalendarLink(l, kunde) {
  const dStart = new Date(l.datum + "T09:00:00");
  const dEnd = new Date(l.datum + "T10:00:00");
  const fmt = (d) => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const titel = encodeURIComponent(`Holzlieferung: ${kunde?.name || "Kunde"}`);
  const details = encodeURIComponent(`${holzartLabel(l)}: ${m3(l.menge)}\nPreis: ${eur(l.gesamtpreis)} (${eur(l.preisProM3)}/m³${l.lieferpreis > 0 ? ` + ${eur(l.lieferpreis)} Lieferung` : ""})\nTelefon: ${kunde?.telefon || "-"}`);
  const ort = encodeURIComponent(kunde?.adresse || "");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titel}&dates=${fmt(dStart)}/${fmt(dEnd)}&details=${details}&location=${ort}`;
}

/* ======================= Längen-Aufteilung Schnittholz ======================= */
const LAENGEN = ["25", "33", "50", "100"];
function leeresLaengenSet() {
  const o = {};
  LAENGEN.forEach((l) => (o[l] = 0));
  o.unsortiert = 0;
  return o;
}
function leererZustand() {
  return {
    bestand: { hart: leeresLaengenSet(), weich: leeresLaengenSet() },
    preisHart: 0,
    preisWeich: 0,
    kunden: [],
    lieferungen: [],
  };
}
function holzartWort(holzart) { return holzart === "hart" ? "Hartholz" : "Weichholz"; }
function holzartLabel(l) {
  const laenge = l.laenge && l.laenge !== "unsortiert" ? `${l.laenge}cm ` : "";
  return `${laenge}${holzartWort(l.holzart)}`;
}
function gesamtMenge(holzartObj) {
  return LAENGEN.reduce((s, l) => s + (holzartObj[l] || 0), 0) + (holzartObj.unsortiert || 0);
}
// Wandelt alte Daten (vor der Längen-Aufteilung: state.hart / state.weich waren einfache Zahlen)
// verlustfrei in das neue Format um - der alte Bestand landet in "unsortiert".
function migriere(data) {
  const z = leererZustand();
  const out = { ...z, ...data };
  out.bestand = { hart: { ...z.bestand.hart, ...(data.bestand && data.bestand.hart) }, weich: { ...z.bestand.weich, ...(data.bestand && data.bestand.weich) } };
  if (typeof data.hart === "number") {
    out.bestand.hart.unsortiert = round2((out.bestand.hart.unsortiert || 0) + data.hart);
  }
  if (typeof data.weich === "number") {
    out.bestand.weich.unsortiert = round2((out.bestand.weich.unsortiert || 0) + data.weich);
  }
  delete out.hart;
  delete out.weich;
  out.lieferungen = (out.lieferungen || []).map((l) => ({
    ...l,
    status: l.status || "ausgeliefert",
    ausgeliefertAm: l.ausgeliefertAm !== undefined ? l.ausgeliefertAm : (l.erstelltAm || null),
  }));
  return out;
}

/* ======================= globaler Zustand ======================= */
let state = leererZustand();
let tab = "bestand";
let dialog = null; // { type, ... }
let filterLieferungen = "anstehend";
let kundenSuche = "";
let kundenSucheFokus = false;
let sicherungsListe = null; // null = noch nicht geladen
let sicherungenLaden = false;
let letzteSicherungInfo = null;
let db, docRef; // werden gesetzt, sobald Firebase geladen ist (siehe initFirebase unten)
let geladen = false;
let verbindungOk = true;
let letzterSync = null;
let schreibtGerade = false;

/* ======================= Google Kalender (OAuth) ======================= */
let googleToken = null; // { access_token, expires_at }
let tokenClient = null;

function initGoogleAuth() {
  if (!window.google || !google.accounts || !google.accounts.oauth2) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/calendar.events",
    callback: (resp) => {
      if (resp && resp.access_token) {
        googleToken = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in * 1000 - 60000) };
        try { localStorage.setItem("google_token", JSON.stringify(googleToken)); } catch (e) {}
        render();
      }
    },
  });
  try {
    const saved = JSON.parse(localStorage.getItem("google_token") || "null");
    if (saved && saved.expires_at > Date.now()) googleToken = saved;
  } catch (e) {}
  render();
}
window.addEventListener("load", initGoogleAuth);

function connectGoogle() {
  if (!tokenClient) return alert("Google-Anmeldung lädt noch, bitte kurz warten und erneut klicken.");
  tokenClient.requestAccessToken({ prompt: googleToken ? "" : "consent" });
}
function trenneGoogle() {
  googleToken = null;
  try { localStorage.removeItem("google_token"); } catch (e) {}
  render();
}

function ensureGoogleToken() {
  if (googleToken && googleToken.expires_at > Date.now()) return Promise.resolve(googleToken.access_token);
  if (!tokenClient) return Promise.resolve(null);
  return new Promise((resolve) => {
    const zuvor = tokenClient.callback;
    tokenClient.callback = (resp) => {
      tokenClient.callback = zuvor;
      if (resp && resp.access_token) {
        googleToken = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in * 1000 - 60000) };
        try { localStorage.setItem("google_token", JSON.stringify(googleToken)); } catch (e) {}
        resolve(googleToken.access_token);
      } else {
        resolve(null);
      }
    };
    tokenClient.requestAccessToken({ prompt: "" });
  });
}

async function erstelleGoogleEvent(l, kunde) {
  const token = await ensureGoogleToken();
  if (!token) return null;
  const dStart = new Date(l.datum + "T09:00:00");
  const dEnd = new Date(l.datum + "T10:00:00");
  const body = {
    summary: `Holzlieferung: ${kunde?.name || "Kunde"}`,
    location: kunde?.adresse || "",
    description: `${holzartLabel(l)}: ${m3(l.menge)}\nPreis: ${eur(l.gesamtpreis)} (${eur(l.preisProM3)}/m³${l.lieferpreis > 0 ? ` + ${eur(l.lieferpreis)} Lieferung` : ""})\nTelefon: ${kunde?.telefon || "-"}`,
    start: { dateTime: dStart.toISOString() },
    end: { dateTime: dEnd.toISOString() },
  };
  try {
    const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    return data.id;
  } catch (e) {
    console.error("Google Kalender Fehler:", e);
    return null;
  }
}

async function loescheGoogleEvent(eventId) {
  if (!eventId) return;
  const token = await ensureGoogleToken();
  if (!token) return;
  try {
    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
      method: "DELETE",
      headers: { Authorization: `Bearer ${token}` },
    });
  } catch (e) {
    console.error("Google Kalender Löschen fehlgeschlagen:", e);
  }
}

async function aktualisiereGoogleEvent(l, kunde) {
  if (!l.googleEventId) return;
  const token = await ensureGoogleToken();
  if (!token) return;
  const dStart = new Date(l.datum + "T09:00:00");
  const dEnd = new Date(l.datum + "T10:00:00");
  const body = {
    summary: `Holzlieferung: ${kunde?.name || "Kunde"}`,
    location: kunde?.adresse || "",
    description: `${holzartLabel(l)}: ${m3(l.menge)}\nPreis: ${eur(l.gesamtpreis)} (${eur(l.preisProM3)}/m³${l.lieferpreis > 0 ? ` + ${eur(l.lieferpreis)} Lieferung` : ""})\nTelefon: ${kunde?.telefon || "-"}`,
    start: { dateTime: dStart.toISOString() },
    end: { dateTime: dEnd.toISOString() },
  };
  try {
    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${l.googleEventId}`, {
      method: "PATCH",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (e) {
    console.error("Google Kalender Aktualisieren fehlgeschlagen:", e);
  }
}

/* ======================= Firebase ======================= */
// Die Firebase-Skripte laden jetzt nicht mehr blockierend (schnellerer Seitenstart),
// darum initialisieren wir erst, sobald das Dokument fertig geparst ist -
// zu diesem Zeitpunkt sind alle "defer"-Skripte garantiert bereits ausgeführt.
function initFirebase() {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  docRef = db.collection("holzstand").doc("zustand");

  docRef.onSnapshot(
    (snap) => {
      verbindungOk = true;
      letzterSync = new Date();
      geladen = true;
      if (snap.exists && !schreibtGerade) {
        const data = snap.data();
        state = migriere(data);
        // Während ein Dialog offen ist, nicht mitten in die Eingabe reinrendern
        if (!dialog) render();
      } else if (!dialog) {
        render();
      }
    },
    (err) => {
      console.error(err);
      verbindungOk = false;
      geladen = true;
      render();
    }
  );
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initFirebase);
} else {
  initFirebase();
}

async function speichern() {
  schreibtGerade = true;
  try {
    await docRef.set(state);
    verbindungOk = true;
  } catch (e) {
    console.error(e);
    verbindungOk = false;
  } finally {
    schreibtGerade = false;
    letzterSync = new Date();
    render();
  }
  pruefeUndErstelleSicherung();
}

/* ======================= Automatische Sicherungen ======================= */
const SICHERUNG_INTERVALL_MS = 6 * 60 * 60 * 1000; // alle 6 Stunden höchstens eine automatische Sicherung
const SICHERUNG_MAX_ANZAHL = 60; // ältere werden automatisch gelöscht

async function pruefeUndErstelleSicherung() {
  try {
    const metaRef = db.collection("holzstand_meta").doc("sicherung");
    const metaSnap = await metaRef.get();
    const meta = metaSnap.exists ? metaSnap.data() : null;
    const letzte = meta && meta.letzteSicherung ? meta.letzteSicherung.toMillis
      ? meta.letzteSicherung.toMillis()
      : new Date(meta.letzteSicherung).getTime()
      : 0;
    if (Date.now() - letzte < SICHERUNG_INTERVALL_MS) return; // noch zu früh
    await erstelleSicherung("automatisch");
    await metaRef.set({ letzteSicherung: firebase.firestore.FieldValue.serverTimestamp() });
  } catch (e) {
    console.error("Automatische Sicherung fehlgeschlagen:", e);
  }
}

async function erstelleSicherung(art) {
  const jetzt = new Date();
  await db.collection("holzstand_sicherungen").add({
    erstelltAm: firebase.firestore.FieldValue.serverTimestamp(),
    erstelltAmClient: jetzt.toISOString(),
    art,
    daten: JSON.stringify(state),
  });
  aufraeumenAlteSicherungen();
}

async function aufraeumenAlteSicherungen() {
  try {
    const snap = await db.collection("holzstand_sicherungen").orderBy("erstelltAmClient", "desc").get();
    const docs = snap.docs;
    if (docs.length > SICHERUNG_MAX_ANZAHL) {
      const zuLoeschen = docs.slice(SICHERUNG_MAX_ANZAHL);
      await Promise.all(zuLoeschen.map((d) => d.ref.delete()));
    }
  } catch (e) {
    console.error("Aufräumen alter Sicherungen fehlgeschlagen:", e);
  }
}

async function sicherungJetztErstellen() {
  await erstelleSicherung("manuell");
  await db.collection("holzstand_meta").doc("sicherung").set({ letzteSicherung: firebase.firestore.FieldValue.serverTimestamp() });
  await sicherungenLaden_();
}

async function sicherungenLaden_() {
  sicherungenLaden = true;
  render();
  try {
    const snap = await db.collection("holzstand_sicherungen").orderBy("erstelltAmClient", "desc").limit(SICHERUNG_MAX_ANZAHL).get();
    sicherungsListe = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) {
    console.error(e);
    sicherungsListe = [];
  } finally {
    sicherungenLaden = false;
    render();
  }
}

async function sicherungWiederherstellen(id) {
  const eintrag = (sicherungsListe || []).find((s) => s.id === id);
  if (!eintrag) return;
  if (!confirm(`Sicherung vom ${new Date(eintrag.erstelltAmClient).toLocaleString("de-DE")} wiederherstellen? Der aktuelle Stand wird dabei überschrieben (er wird vorher aber selbst als Sicherung abgelegt).`)) return;
  await erstelleSicherung("vor_wiederherstellung");
  const wiederhergestellt = JSON.parse(eintrag.daten);
  state = migriere(wiederhergestellt);
  render();
  await speichern();
  alert("Sicherung wurde wiederhergestellt.");
}

function sicherungHerunterladen(id) {
  const eintrag = id === "aktuell" ? { erstelltAmClient: new Date().toISOString(), daten: JSON.stringify(state) } : (sicherungsListe || []).find((s) => s.id === id);
  if (!eintrag) return;
  const blob = new Blob([eintrag.daten], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const datumStr = new Date(eintrag.erstelltAmClient).toISOString().slice(0, 19).replace(/[:T]/g, "-");
  a.href = url;
  a.download = `holzstand-sicherung-${datumStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ======================= Aktionen ======================= */
function holzEinlagern(menge, holzart, laenge) {
  state.bestand[holzart][laenge] = round2((state.bestand[holzart][laenge] || 0) + menge);
  dialog = null;
  speichern();
}
function kundeHinzufuegen(name, telefon, adresse) {
  state.kunden.push({ id: uid(), name, telefon, adresse });
  dialog = null;
  speichern();
}
function kundeLoeschen(id) {
  state.kunden = state.kunden.filter((k) => k.id !== id);
  dialog = null;
  speichern();
}
async function lieferungHinzufuegen(kundeId, holzart, laenge, menge, preisProM3, lieferpreis, datum) {
  const bestand = state.bestand[holzart][laenge] || 0;
  if (menge > bestand) {
    dialog.fehler = `Nicht genug ${holzartWort(holzart)} in ${laenge === "unsortiert" ? "Unsortiert" : laenge + "cm"} auf Lager (${m3(bestand)} verfügbar).`;
    render();
    return;
  }
  const kunde = state.kunden.find((k) => k.id === kundeId);
  const holzpreis = round2(menge * preisProM3);
  const neueLieferung = {
    id: uid(), kundeId, holzart, laenge, menge, preisProM3, lieferpreis: round2(lieferpreis || 0),
    gesamtpreis: round2(holzpreis + (lieferpreis || 0)), datum, erstelltAm: new Date().toISOString(),
    status: "offen", ausgeliefertAm: null,
    googleEventId: null,
  };
  state.bestand[holzart][laenge] = round2(bestand - menge);
  state.lieferungen.push(neueLieferung);
  dialog = null;
  render();
  await speichern();

  if (googleToken || tokenClient) {
    const eventId = await erstelleGoogleEvent(neueLieferung, kunde);
    if (eventId) {
      neueLieferung.googleEventId = eventId;
      await speichern();
    }
  }
}
function lieferungAlsAusgeliefertMarkieren(id) {
  const l = state.lieferungen.find((x) => x.id === id);
  if (!l) return;
  l.status = "ausgeliefert";
  l.ausgeliefertAm = new Date().toISOString();
  speichern();
}
function lieferungAlsOffenMarkieren(id) {
  const l = state.lieferungen.find((x) => x.id === id);
  if (!l) return;
  l.status = "offen";
  l.ausgeliefertAm = null;
  speichern();
}
async function lieferungAktualisieren(id, kundeId, holzart, laenge, menge, preisProM3, lieferpreis, datum) {
  const l = state.lieferungen.find((x) => x.id === id);
  if (!l) return;

  // Alte Menge erstmal gedanklich zurückbuchen, um zu prüfen ob die neue Menge passt
  const alteMenge = l.menge, alteHolzart = l.holzart, alteLaenge = l.laenge;
  state.bestand[alteHolzart][alteLaenge] = round2((state.bestand[alteHolzart][alteLaenge] || 0) + alteMenge);

  const verfuegbar = state.bestand[holzart][laenge] || 0;
  if (menge > verfuegbar) {
    // Rückgängig machen, da nicht genug Bestand für die neue Menge da ist
    state.bestand[alteHolzart][alteLaenge] = round2(state.bestand[alteHolzart][alteLaenge] - alteMenge);
    dialog.fehler = `Nicht genug ${holzartWort(holzart)} in ${laenge === "unsortiert" ? "Unsortiert" : laenge + "cm"} auf Lager (${m3(verfuegbar)} verfügbar).`;
    render();
    return;
  }
  state.bestand[holzart][laenge] = round2(verfuegbar - menge);

  const holzpreis = round2(menge * preisProM3);
  l.kundeId = kundeId;
  l.holzart = holzart;
  l.laenge = laenge;
  l.menge = menge;
  l.preisProM3 = preisProM3;
  l.lieferpreis = round2(lieferpreis || 0);
  l.gesamtpreis = round2(holzpreis + (lieferpreis || 0));
  l.datum = datum;

  dialog = null;
  render();
  await speichern();

  if (l.googleEventId) {
    const kunde = state.kunden.find((k) => k.id === kundeId);
    await aktualisiereGoogleEvent(l, kunde);
  }
}
async function lieferungLoeschen(id) {
  const l = state.lieferungen.find((x) => x.id === id);
  if (!l) return;
  const istOffen = l.status !== "ausgeliefert";
  const hinweis = istOffen
    ? "Lieferung wirklich löschen? Die Menge wandert wieder zurück in den Lagerbestand."
    : "Diese Lieferung ist bereits als ausgeliefert markiert und zählt zur Jahresstatistik. Wirklich endgültig löschen? Der Bestand wird dabei NICHT wieder aufgefüllt.";
  if (!confirm(hinweis)) return;
  if (istOffen) {
    // Noch nicht ausgeliefert -> Bestand war nur reserviert, wandert zurück ins Lager
    const laenge = l.laenge || "unsortiert";
    state.bestand[l.holzart][laenge] = round2((state.bestand[l.holzart][laenge] || 0) + l.menge);
  }
  // Bereits ausgelieferte Verkäufe: Bestand bleibt unangetastet, nur der Datensatz wird entfernt
  state.lieferungen = state.lieferungen.filter((x) => x.id !== id);
  render();
  await speichern();
  if (l.googleEventId) await loescheGoogleEvent(l.googleEventId);
}

function laengenZeile(bezeichnung, wert, max, farbe) {
  const prozent = Math.max(4, Math.min(100, (wert / max) * 100));
  return `
    <div class="flex items-center gap-2">
      <span class="text-xs text-[#6b4a30] w-16 shrink-0">${bezeichnung}</span>
      <div class="h-2.5 rounded-full bg-[#2b1d13]/10 overflow-hidden plank flex-1">
        <div class="h-full rounded-full transition-all duration-500" style="width:${prozent}%; background-color:${farbe};"></div>
      </div>
      <span class="f-num text-xs w-16 text-right shrink-0">${m3(wert)}</span>
    </div>`;
}

function holzartKarte(holzart, label, farbe, icon, feld) {
  const bestand = state.bestand[holzart];
  const gesamt = gesamtMenge(bestand);
  const preis = state[feld] || 0;
  const maxLaenge = Math.max(...LAENGEN.map((l) => bestand[l] || 0), bestand.unsortiert || 0, 1);
  const zeilen = LAENGEN.map((l) => laengenZeile(`${l} cm`, bestand[l] || 0, maxLaenge, farbe)).join("");
  const unsortiertZeile = bestand.unsortiert > 0 ? laengenZeile("Unsortiert", bestand.unsortiert, maxLaenge, "#8a6a3f") : "";
  return `
    <div class="bg-[#f3ead3] rounded-lg p-4 border border-[#2b1d13]/10">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-sm text-[#4a3626]"><span>${icon}</span>${label}</div>
        <span class="f-num text-base font-semibold">${m3(gesamt)}</span>
      </div>
      <div class="space-y-2">${zeilen}${unsortiertZeile}</div>
      <div class="flex items-center justify-between mt-3 pt-2 border-t border-[#2b1d13]/10">
        <span class="text-xs text-[#6b4a30]">${preis > 0 ? `${eur(preis)}/m³ · Bestandswert ${eur(gesamt * preis)}` : "Kein Preis hinterlegt"}</span>
        <button onclick="openDialog({type:'preis', feld:'${feld}', label:'${label}'})" class="text-xs text-[#c96f3e] font-medium">✎ Preis ändern</button>
      </div>
    </div>`;
}

function renderBestand() {
  const gesamtHart = gesamtMenge(state.bestand.hart);
  const gesamtWeich = gesamtMenge(state.bestand.weich);
  const gesamt = gesamtHart + gesamtWeich;
  const gesamtWert = gesamtHart * (state.preisHart || 0) + gesamtWeich * (state.preisWeich || 0);
  return `
    <div class="space-y-5 mt-2">
      <section class="bg-[#f3ead3] rounded-lg p-4 border border-[#2b1d13]/10">
        <h2 class="f-head text-sm text-[#6b4a30] mb-3">Zum Verkauf bereit</h2>
        <div class="flex items-baseline gap-2">
          <span class="f-num text-4xl font-bold">${m3(gesamt)}</span>
          <span class="text-xs text-[#6b4a30]">Schnittholz gesamt</span>
        </div>
        ${gesamtWert > 0 ? `<p class="text-xs text-[#6b4a30] mt-1">Gesamtwert zum aktuellen Preis: ${eur(gesamtWert)}</p>` : ""}
      </section>
      ${holzartKarte("hart", "Schnittholz Hart", "#5c3d2e", "📦", "preisHart")}
      ${holzartKarte("weich", "Schnittholz Weich", "#c9a66b", "📦", "preisWeich")}
      <button onclick="openDialog({type:'einlagern'})" class="w-full flex items-center justify-center gap-2 bg-[#2b1d13] text-[#e8ddc3] rounded-lg py-3 text-sm font-medium">+ Holz einlagern</button>
    </div>`;
}

function summeProKunde(kundeId) {
  return state.lieferungen.filter((l) => l.kundeId === kundeId && l.status === "ausgeliefert")
    .reduce((acc, l) => ({ menge: acc.menge + l.menge, preis: acc.preis + l.gesamtpreis }), { menge: 0, preis: 0 });
}

function renderKunden() {
  const suchbegriff = kundenSuche.trim().toLowerCase();
  let ersterTrefferGesetzt = false;

  const liste = state.kunden.map((k) => {
    const s = summeProKunde(k.id);
    const istTreffer = !!suchbegriff && k.name.toLowerCase().includes(suchbegriff);
    const istErsterTreffer = istTreffer && !ersterTrefferGesetzt;
    if (istErsterTreffer) ersterTrefferGesetzt = true;
    return `
      <button id="kunde-zeile-${k.id}" ${istErsterTreffer ? 'data-erster-treffer="1"' : ""} onclick='openDialog({type:"kundeDetail", kundeId:"${k.id}"})' class="w-full text-left rounded-lg p-3.5 border flex items-center justify-between transition-colors ${istTreffer ? "bg-[#c96f3e]/20 border-[#c96f3e]" : "bg-[#f3ead3] border-[#2b1d13]/10"}">
        <div>
          <p class="font-medium">${esc(k.name)}</p>
          <p class="text-xs text-[#6b4a30] mt-0.5">${s.menge > 0 ? `${m3(s.menge)} · ${eur(s.preis)} insgesamt` : "Noch keine Lieferung"}</p>
        </div>
        <span class="text-[#6b4a30]">›</span>
      </button>`;
  }).join("");

  const suchfeld = state.kunden.length === 0 ? "" : `
      <input id="kunden-suche" type="text" placeholder="Kunde suchen…" value="${esc(kundenSuche)}"
        oninput="kundenSuche=this.value; render();" onfocus="kundenSucheFokus=true"
        class="w-full border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#f3ead3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" />`;

  const keinTreffer = suchbegriff && !ersterTrefferGesetzt;

  return `
    <div class="mt-2 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="f-head text-sm text-[#6b4a30]">Kunden (${state.kunden.length})</h2>
        <button onclick="openDialog({type:'kunde'})" class="flex items-center gap-1 text-sm bg-[#2b1d13] text-[#e8ddc3] rounded-full px-3 py-1.5">+ Neu</button>
      </div>
      ${suchfeld}
      ${keinTreffer ? `<p class="text-xs text-[#6b4a30]">Kein Kunde gefunden für "${esc(kundenSuche.trim())}".</p>` : ""}
      ${state.kunden.length === 0 ? leererHinweis("Noch keine Kunden eingetragen. Leg deinen ersten Kunden an.") : `<div class="space-y-2">${liste}</div>`}
    </div>`;
}

function leererHinweis(text) {
  return `<div class="bg-[#f3ead3]/60 border border-dashed border-[#2b1d13]/20 rounded-lg p-5 text-center"><p class="text-sm text-[#6b4a30]">${esc(text)}</p></div>`;
}

function renderLieferungen() {
  const heuteStr = heute();
  let gefiltert = state.lieferungen.slice();
  if (filterLieferungen === "anstehend") gefiltert = gefiltert.filter((l) => l.datum >= heuteStr && l.status !== "ausgeliefert");
  if (filterLieferungen === "offen") gefiltert = gefiltert.filter((l) => l.status !== "ausgeliefert");
  if (filterLieferungen === "ausgeliefert") gefiltert = gefiltert.filter((l) => l.status === "ausgeliefert");
  gefiltert.sort((a, b) => a.datum.localeCompare(b.datum));

  const karten = gefiltert.map((l) => {
    const kunde = state.kunden.find((k) => k.id === l.kundeId);
    const istHart = l.holzart === "hart";
    const farbe = istHart ? "#5c3d2e" : "#c9a66b";
    const istAusgeliefert = l.status === "ausgeliefert";
    return `
      <div class="bg-[#f3ead3] rounded-lg border border-[#2b1d13]/10 overflow-hidden flex">
        <div class="w-1.5" style="background-color:${farbe}"></div>
        <div class="flex-1 p-3.5">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="font-medium">${esc(kunde?.name || "Unbekannter Kunde")}</p>
              <p class="text-xs text-[#6b4a30] flex items-center gap-1 mt-0.5">📅 ${formatDatum(l.datum)}</p>
            </div>
            <div class="flex flex-col items-end gap-1 shrink-0">
              <span class="f-head text-[10px] px-2 py-1 rounded stamp" style="color:${farbe}">${holzartLabel(l)}</span>
              ${istAusgeliefert
                ? `<span class="text-[10px] text-[#3e6b3e] font-medium">✓ Ausgeliefert</span>`
                : `<span class="text-[10px] text-[#a67c3e] font-medium">○ Offen</span>`}
            </div>
          </div>
          <div class="flex items-end justify-between mt-3">
            <div>
              <p class="f-num text-lg font-bold">${m3(l.menge)}</p>
              <p class="text-xs text-[#6b4a30]">${eur(l.preisProM3)}/m³${l.lieferpreis > 0 ? ` · +${eur(l.lieferpreis)} Lieferung` : ""} · <span class="font-semibold">${eur(l.gesamtpreis)}</span></p>
            </div>
            <div class="flex gap-2">
              <a href="${googleCalendarLink(l, kunde)}" target="_blank" rel="noopener noreferrer" class="text-xs flex items-center gap-1 bg-[#2b1d13] text-[#e8ddc3] rounded-full px-2.5 py-1.5">📅 Kalender</a>
              <button onclick="lieferungBearbeiten('${l.id}')" class="text-xs flex items-center gap-1 border border-[#2b1d13]/20 text-[#4a3626] rounded-full px-2.5 py-1.5">✎ Bearbeiten</button>
              <button onclick="lieferungLoeschen('${l.id}')" class="text-[#a62f2f] p-1.5">🗑</button>
            </div>
          </div>
          ${istAusgeliefert
            ? `<button onclick="lieferungAlsOffenMarkieren('${l.id}')" class="text-xs text-[#6b4a30] mt-2 underline">Ausgeliefert-Markierung zurücknehmen</button>`
            : `<button onclick="lieferungAlsAusgeliefertMarkieren('${l.id}')" class="w-full mt-2 text-xs bg-[#3e6b3e]/10 text-[#3e6b3e] border border-[#3e6b3e]/30 rounded-lg py-2 font-medium">✓ Als ausgeliefert markieren</button>`}
        </div>
      </div>`;
  }).join("");

  return `
    <div class="mt-2 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="f-head text-sm text-[#6b4a30]">Lieferungen</h2>
        <div class="flex gap-2">
          <button onclick="openDialog({type:'jahresuebersicht'})" class="flex items-center gap-1 text-sm border border-[#2b1d13]/20 text-[#4a3626] rounded-full px-3 py-1.5">📊 Jahresübersicht</button>
          <button onclick="openDialog({type:'lieferung'})" ${state.kunden.length === 0 ? "disabled" : ""} class="flex items-center gap-1 text-sm bg-[#2b1d13] text-[#e8ddc3] rounded-full px-3 py-1.5 disabled:opacity-40">+ Neu</button>
        </div>
      </div>
      <div class="flex gap-2 flex-wrap">
        ${[["anstehend", "Anstehend"], ["offen", "Offen"], ["ausgeliefert", "Ausgeliefert"], ["alle", "Alle"]].map(([id, label]) => `
          <button onclick="filterLieferungen='${id}'; render();" class="text-xs px-3 py-1.5 rounded-full border ${filterLieferungen === id ? "bg-[#c96f3e] border-[#c96f3e] font-medium" : "border-[#2b1d13]/20 text-[#6b4a30]"}">${label}</button>
        `).join("")}
      </div>
      ${state.kunden.length === 0 ? leererHinweis("Leg zuerst einen Kunden an, bevor du eine Lieferung einträgst.") : ""}
      ${state.kunden.length > 0 && gefiltert.length === 0 ? leererHinweis("Keine Lieferungen in dieser Ansicht.") : ""}
      <div class="space-y-3">${karten}</div>
    </div>`;
}

function renderSicherung() {
  const artLabel = { automatisch: "Automatisch", manuell: "Manuell", vor_wiederherstellung: "Vor Wiederherstellung" };
  const liste = (sicherungsListe || []).map((s) => `
    <div class="bg-[#f3ead3] rounded-lg p-3.5 border border-[#2b1d13]/10 flex items-center justify-between gap-2">
      <div>
        <p class="text-sm font-medium">${new Date(s.erstelltAmClient).toLocaleString("de-DE")}</p>
        <p class="text-xs text-[#6b4a30]">${artLabel[s.art] || s.art}</p>
      </div>
      <div class="flex gap-2 shrink-0">
        <button onclick="sicherungHerunterladen('${s.id}')" class="text-xs bg-[#2b1d13] text-[#e8ddc3] rounded-full px-2.5 py-1.5">⬇ Datei</button>
        <button onclick="sicherungWiederherstellen('${s.id}')" class="text-xs border border-[#a62f2f]/40 text-[#a62f2f] rounded-full px-2.5 py-1.5">↺ Wiederherstellen</button>
      </div>
    </div>`).join("");

  return `
    <div class="mt-2 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="f-head text-sm text-[#6b4a30]">Sicherungen</h2>
        <button onclick="sicherungJetztErstellen()" class="flex items-center gap-1 text-sm bg-[#2b1d13] text-[#e8ddc3] rounded-full px-3 py-1.5">💾 Jetzt sichern</button>
      </div>

      <div class="bg-[#f3ead3]/60 border border-dashed border-[#2b1d13]/20 rounded-lg p-4">
        <p class="text-sm text-[#4a3626] mb-2">Alle 6 Stunden wird automatisch eine Sicherung deiner Daten abgelegt (die letzten ${SICHERUNG_MAX_ANZAHL} bleiben erhalten). Zusätzlich kannst du den aktuellen Stand jederzeit direkt als Datei herunterladen.</p>
        <button onclick="sicherungHerunterladen('aktuell')" class="text-xs bg-[#c96f3e] text-[#2b1d13] rounded-full px-3 py-1.5 font-medium">⬇ Aktuellen Stand als Datei herunterladen</button>
      </div>

      ${sicherungenLaden ? `<p class="text-sm text-[#6b4a30]">Sicherungen werden geladen…</p>` : ""}
      ${!sicherungenLaden && sicherungsListe && sicherungsListe.length === 0 ? leererHinweis("Noch keine automatische Sicherung vorhanden – die erste entsteht bei der nächsten Änderung.") : ""}
      <div class="space-y-2">${liste}</div>
    </div>`;
}


function renderDialog() {
  let titel = "", body = "";

  if (dialog.type === "einlagern") {
    dialog.ziel = dialog.ziel || "hart";
    dialog.laenge = dialog.laenge || "25";
    titel = "Holz einlagern";
    const holzartBtn = (id, txt) => `<button onclick="setEinlagernZiel('${id}')" class="py-2.5 rounded-lg text-sm border-2 ${dialog.ziel === id ? "border-[#c96f3e] bg-[#c96f3e]/10 font-medium" : "border-[#2b1d13]/15 text-[#6b4a30]"}">${txt}</button>`;
    const laengeBtn = (l) => `<button onclick="setEinlagernLaenge('${l}')" class="py-2 rounded-lg text-xs border-2 ${dialog.laenge === l ? "border-[#c96f3e] bg-[#c96f3e]/10 font-medium" : "border-[#2b1d13]/15 text-[#6b4a30]"}">${l} cm</button>`;
    body = `
      <label class="text-sm text-[#4a3626] block mb-1">Menge (m³)</label>
      <input id="eingabe-menge" inputmode="decimal" placeholder="0,00" value="${dialog.mengeEingabe || ""}" oninput="dialog.mengeEingabe=this.value" class="f-num w-full text-2xl border border-[#2b1d13]/20 rounded-lg px-3 py-2 mb-4 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" />
      <label class="text-sm text-[#4a3626] block mb-2">Holzart</label>
      <div class="grid grid-cols-2 gap-2 mb-3">${holzartBtn("hart", "Hartholz")}${holzartBtn("weich", "Weichholz")}</div>
      <label class="text-sm text-[#4a3626] block mb-2">Länge</label>
      <div class="grid grid-cols-4 gap-2 mb-4">${LAENGEN.map(laengeBtn).join("")}</div>
      <button onclick="bestaetigeEinlagern()" class="w-full bg-[#c96f3e] text-[#2b1d13] rounded-lg py-3 text-sm font-medium">Einlagern</button>`;
  }

  if (dialog.type === "preis") {
    const aktuell = state[dialog.feld] || 0;
    titel = `Preis: ${dialog.label}`;
    body = `
      <p class="text-xs text-[#6b4a30] mb-3">Aktueller Preis: ${aktuell > 0 ? eur(aktuell) + "/m³" : "noch kein Preis hinterlegt"}</p>
      <label class="text-sm text-[#4a3626] block mb-1">Neuer Preis pro m³ (€)</label>
      <input id="eingabe-preis" inputmode="decimal" placeholder="0,00" value="${aktuell > 0 ? String(aktuell).replace(".", ",") : ""}" class="f-num w-full text-2xl border border-[#2b1d13]/20 rounded-lg px-3 py-2 mb-3 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" />
      <button onclick="bestaetigePreis()" class="w-full bg-[#c96f3e] text-[#2b1d13] rounded-lg py-3 text-sm font-medium">Preis speichern</button>`;
  }

  if (dialog.type === "kunde") {
    titel = "Neuer Kunde";
    body = `
      <div class="space-y-3">
        <div><label class="text-xs text-[#6b4a30] block mb-1">Name</label><input id="k-name" placeholder="z. B. Müller Bau GmbH" class="w-full border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" /></div>
        <div><label class="text-xs text-[#6b4a30] block mb-1">Telefon</label><input id="k-telefon" placeholder="0170 1234567" class="w-full border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" /></div>
        <div><label class="text-xs text-[#6b4a30] block mb-1">Adresse</label><input id="k-adresse" placeholder="Straße, PLZ Ort" class="w-full border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" /></div>
      </div>
      <button onclick="bestaetigeKunde()" class="w-full mt-4 bg-[#c96f3e] text-[#2b1d13] rounded-lg py-3 text-sm font-medium">Kunde speichern</button>`;
  }

  if (dialog.type === "kundeDetail") {
    const k = state.kunden.find((x) => x.id === dialog.kundeId);
    if (!k) { dialog = null; return ""; }
    const lieferungen = state.lieferungen.filter((l) => l.kundeId === k.id);
    const gesamt = lieferungen.filter((l) => l.status === "ausgeliefert")
      .reduce((acc, l) => ({ menge: acc.menge + l.menge, preis: acc.preis + l.gesamtpreis }), { menge: 0, preis: 0 });
    titel = k.name;
    body = `
      <div class="space-y-1.5 mb-4">
        ${k.telefon ? `<p class="text-sm flex items-center gap-2">📞 ${esc(k.telefon)}</p>` : ""}
        ${k.adresse ? `<p class="text-sm flex items-center gap-2">📍 ${esc(k.adresse)}</p>` : ""}
      </div>
      <div class="bg-[#e8ddc3] rounded-lg p-3 mb-4">
        <p class="text-xs text-[#6b4a30] mb-1">Insgesamt gekauft (ausgeliefert)</p>
        <p class="f-num text-xl font-bold">${m3(gesamt.menge)} · ${eur(gesamt.preis)}</p>
      </div>
      ${lieferungen.length > 0 ? `
        <div class="mb-4">
          <p class="text-xs text-[#6b4a30] mb-2">Lieferhistorie</p>
          <div class="space-y-1.5 max-h-40 overflow-y-auto">
            ${lieferungen.slice().sort((a, b) => b.datum.localeCompare(a.datum)).map((l) => `
              <div class="flex justify-between text-sm border-b border-[#2b1d13]/10 pb-1.5">
                <span>${formatDatum(l.datum)} · ${holzartLabel(l)} ${l.status === "ausgeliefert" ? "✓" : "○"}</span>
                <span class="f-num">${m3(l.menge)}</span>
              </div>`).join("")}
          </div>
        </div>` : ""}
      <button onclick="kundeLoeschenBestaetigen('${k.id}')" class="flex items-center gap-2 text-sm text-[#a62f2f] mt-2">🗑 Kunde löschen</button>`;
  }

  if (dialog.type === "jahresuebersicht") {
    const ausgelieferte = state.lieferungen.filter((l) => l.status === "ausgeliefert");
    const aktuellesJahr = new Date().getFullYear();
    // Immer die letzten 25 Jahre zur Auswahl anbieten, plus ältere Jahre mit tatsächlichen Verkäufen
    const jahreMitDaten = Array.from(new Set(ausgelieferte.map((l) => parseInt(l.datum.slice(0, 4), 10))));
    const jahre = Array.from(new Set([
      ...Array.from({ length: 25 }, (_, i) => aktuellesJahr - i),
      ...jahreMitDaten,
    ])).sort((a, b) => b - a).map(String);
    dialog.jahr = dialog.jahr || String(aktuellesJahr);

    const jahresLieferungen = ausgelieferte.filter((l) => l.datum.slice(0, 4) === dialog.jahr);

    const leereBucket = () => ({ hart: leeresLaengenSet(), weich: leeresLaengenSet(), preis: 0, menge: 0 });
    const gesamtBucket = leereBucket();
    const proKunde = {};
    jahresLieferungen.forEach((l) => {
      if (!proKunde[l.kundeId]) proKunde[l.kundeId] = leereBucket();
      const laenge = l.laenge || "unsortiert";
      proKunde[l.kundeId][l.holzart][laenge] = round2((proKunde[l.kundeId][l.holzart][laenge] || 0) + l.menge);
      proKunde[l.kundeId].preis = round2(proKunde[l.kundeId].preis + l.gesamtpreis);
      proKunde[l.kundeId].menge = round2(proKunde[l.kundeId].menge + l.menge);
      gesamtBucket[l.holzart][laenge] = round2((gesamtBucket[l.holzart][laenge] || 0) + l.menge);
      gesamtBucket.preis = round2(gesamtBucket.preis + l.gesamtpreis);
      gesamtBucket.menge = round2(gesamtBucket.menge + l.menge);
    });

    const laengenZeileKompakt = (bucket) => {
      const teile = LAENGEN.map((l) => (bucket[l] > 0 ? `${l}cm: ${m3(bucket[l])}` : null)).filter(Boolean);
      if (bucket.unsortiert > 0) teile.push(`Unsortiert: ${m3(bucket.unsortiert)}`);
      return teile.length ? teile.join(" · ") : null;
    };

    const holzartZeilen = (bucket) => `
      ${laengenZeileKompakt(bucket.hart) ? `<p class="text-xs text-[#6b4a30]"><span class="font-medium">Hart:</span> ${laengenZeileKompakt(bucket.hart)}</p>` : ""}
      ${laengenZeileKompakt(bucket.weich) ? `<p class="text-xs text-[#6b4a30]"><span class="font-medium">Weich:</span> ${laengenZeileKompakt(bucket.weich)}</p>` : ""}`;

    const zeilen = Object.entries(proKunde)
      .sort((a, b) => b[1].preis - a[1].preis)
      .map(([kundeId, sum]) => {
        const kunde = state.kunden.find((k) => k.id === kundeId);
        return `
          <div class="border-b border-[#2b1d13]/10 py-2.5">
            <div class="flex justify-between items-center mb-1">
              <span class="text-sm font-medium">${esc(kunde?.name || "Unbekannter Kunde")}</span>
              <span class="f-num text-sm font-semibold">${eur(sum.preis)}</span>
            </div>
            ${holzartZeilen(sum)}
          </div>`;
      }).join("");

    titel = "Jahresübersicht";
    body = `
      <div class="flex items-center gap-2 mb-4">
        <select onchange="setJahresuebersichtJahr(this.value)" class="border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]">
          ${jahre.map((j) => `<option value="${j}" ${dialog.jahr === j ? "selected" : ""}>${j}</option>`).join("")}
        </select>
        ${dialog.jahr !== String(aktuellesJahr) ? `<button onclick="setJahresuebersichtJahr('${aktuellesJahr}')" class="text-xs px-3 py-1.5 rounded-full border border-[#c96f3e] text-[#c96f3e] font-medium">→ Aktuelles Jahr ${aktuellesJahr}</button>` : ""}
      </div>
      <div class="bg-[#e8ddc3] rounded-lg p-3 mb-4">
        <p class="text-xs text-[#6b4a30] mb-1">Gesamt ${dialog.jahr} (ausgeliefert) · ${eur(gesamtBucket.preis)}</p>
        ${holzartZeilen(gesamtBucket) || `<p class="text-xs text-[#6b4a30]">Keine Verkäufe</p>`}
      </div>
      <p class="text-xs text-[#6b4a30] mb-2">Pro Kunde</p>
      ${zeilen ? `<div class="max-h-72 overflow-y-auto">${zeilen}</div>` : leererHinweis(`Keine ausgelieferten Verkäufe im Jahr ${dialog.jahr}.`)}`;
  }

  if (dialog.type === "lieferung") {
    dialog.holzart = dialog.holzart || "hart";
    dialog.laenge = dialog.laenge || "25";
    dialog.kundeId = dialog.kundeId || (state.kunden[0] && state.kunden[0].id) || "";
    const holzart = dialog.holzart;
    const laenge = dialog.laenge;
    const optionen = state.kunden.map((k) => `<option value="${k.id}" ${dialog.kundeId === k.id ? "selected" : ""}>${esc(k.name)}</option>`).join("");
    const preisAktuell = holzart === "hart" ? state.preisHart : state.preisWeich;
    const preisVoreinstellung = dialog.preisEingabe !== undefined ? dialog.preisEingabe : (preisAktuell > 0 ? String(preisAktuell).replace(".", ",") : "");
    titel = dialog.bearbeitenId ? "Lieferung bearbeiten" : "Neue Lieferung";
    const holzartBtn = (id, txt) => `<button onclick="setLieferungHolzart('${id}')" class="py-2 rounded-lg text-xs border-2 ${holzart === id ? "border-[#c96f3e] bg-[#c96f3e]/10 font-medium" : "border-[#2b1d13]/15 text-[#6b4a30]"}">${txt} · ${m3(gesamtMenge(state.bestand[id]))}</button>`;
    const laengeBtn = (l) => {
      const verfuegbar = state.bestand[holzart][l] || 0;
      return `<button onclick="setLieferungLaenge('${l}')" class="py-2 rounded-lg text-xs border-2 ${laenge === l ? "border-[#c96f3e] bg-[#c96f3e]/10 font-medium" : "border-[#2b1d13]/15 text-[#6b4a30]"}">${l} cm<br><span class="f-num">${m3(verfuegbar)}</span></button>`;
    };
    const unsortiertVerfuegbar = state.bestand[holzart].unsortiert || 0;
    body = `
      <div class="space-y-3">
        <div>
          <label class="text-xs text-[#6b4a30] block mb-1">Kunde</label>
          <select id="l-kunde" onchange="dialog.kundeId=this.value" class="w-full border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]">${optionen}</select>
        </div>
        <div>
          <label class="text-xs text-[#6b4a30] block mb-2">Holzart</label>
          <div class="grid grid-cols-2 gap-2">${holzartBtn("hart", "Hart")}${holzartBtn("weich", "Weich")}</div>
        </div>
        <div>
          <label class="text-xs text-[#6b4a30] block mb-2">Länge</label>
          <div class="grid grid-cols-4 gap-2">${LAENGEN.map(laengeBtn).join("")}</div>
          ${unsortiertVerfuegbar > 0 ? `<button onclick="setLieferungLaenge('unsortiert')" class="w-full mt-2 py-2 rounded-lg text-xs border-2 ${laenge === "unsortiert" ? "border-[#c96f3e] bg-[#c96f3e]/10 font-medium" : "border-[#2b1d13]/15 text-[#6b4a30]"}">Unsortiert (alter Bestand) · ${m3(unsortiertVerfuegbar)}</button>` : ""}
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs text-[#6b4a30] block mb-1">Menge (m³)</label><input id="l-menge" inputmode="decimal" placeholder="0,00" value="${dialog.mengeEingabe || ""}" onfocus="dialog.fokusId=this.id" oninput="dialog.mengeEingabe=this.value; render();" class="f-num w-full border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" /></div>
          <div><label class="text-xs text-[#6b4a30] block mb-1">Preis/m³ (€)</label><input id="l-preis" inputmode="decimal" placeholder="0,00" value="${preisVoreinstellung}" onfocus="dialog.fokusId=this.id" oninput="dialog.preisEingabe=this.value; render();" class="f-num w-full border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" /></div>
        </div>
        <div>
          <label class="text-xs text-[#6b4a30] block mb-1">Lieferpreis (€, frei wählbar)</label>
          <input id="l-lieferpreis" inputmode="decimal" placeholder="0,00" value="${dialog.lieferpreisEingabe || ""}" onfocus="dialog.fokusId=this.id" oninput="dialog.lieferpreisEingabe=this.value; render();" class="f-num w-full border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" />
        </div>
        <div><label class="text-xs text-[#6b4a30] block mb-1">Liefertermin</label><input id="l-datum" type="date" value="${dialog.datumEingabe || heute()}" oninput="dialog.datumEingabe=this.value" class="w-full border border-[#2b1d13]/20 rounded-lg px-3 py-2 bg-[#e8ddc3] focus:outline-none focus:ring-2 focus:ring-[#c96f3e]" /></div>
        ${dialog.fehler ? `<p class="text-xs text-[#a62f2f]">${esc(dialog.fehler)}</p>` : ""}
        ${(() => {
          const mengeNum = parseFloat(String(dialog.mengeEingabe || "").replace(",", "."));
          const preisNum = parseFloat(String(preisVoreinstellung || "").replace(",", "."));
          const lieferNum = parseFloat(String(dialog.lieferpreisEingabe || "0").replace(",", ".")) || 0;
          if (!Number.isFinite(mengeNum) || !Number.isFinite(preisNum)) return "";
          const holzpreis = mengeNum * preisNum;
          return `<div class="bg-[#e8ddc3] rounded-lg p-3 space-y-1">
            <div class="flex justify-between text-xs text-[#6b4a30]"><span>Holzpreis</span><span class="f-num">${eur(holzpreis)}</span></div>
            <div class="flex justify-between text-xs text-[#6b4a30]"><span>Lieferpreis</span><span class="f-num">${eur(lieferNum)}</span></div>
            <div class="flex justify-between text-sm font-semibold pt-1 border-t border-[#2b1d13]/10"><span>Gesamt</span><span class="f-num">${eur(holzpreis + lieferNum)}</span></div>
          </div>`;
        })()}
      </div>
      <button onclick="bestaetigeLieferung()" class="w-full mt-4 bg-[#c96f3e] text-[#2b1d13] rounded-lg py-3 text-sm font-medium">${dialog.bearbeitenId ? "✓ Änderungen speichern" : "✓ Lieferung eintragen &amp; Bestand abziehen"}</button>`;
  }

  return `
    <div class="fixed inset-0 bg-black/40 z-30 flex items-end sm:items-center justify-center" onclick="if(event.target===this) closeDialog()">
      <div class="bg-[#f3ead3] w-full sm:max-w-sm sm:rounded-xl rounded-t-2xl p-5 pb-6" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between mb-4">
          <h3 class="f-head text-base">${esc(titel)}</h3>
          <button onclick="closeDialog()" class="text-[#6b4a30] text-lg leading-none">✕</button>
        </div>
        ${body}
      </div>
    </div>`;
}

function nachRenderVerkabeln() {
  const menge = document.getElementById("eingabe-menge");
  if (menge) menge.focus();
  const preis = document.getElementById("eingabe-preis");
  if (preis) { preis.focus(); preis.select(); }
  if (dialog && dialog.fokusId) {
    const el = document.getElementById(dialog.fokusId);
    if (el) {
      el.focus();
      const len = el.value.length;
      try { el.setSelectionRange(len, len); } catch (e) {}
    }
  }
  if (kundenSucheFokus) {
    const suche = document.getElementById("kunden-suche");
    if (suche) {
      suche.focus();
      const len = suche.value.length;
      try { suche.setSelectionRange(len, len); } catch (e) {}
    }
  }
  if (kundenSuche.trim()) {
    const treffer = document.querySelector('[data-erster-treffer="1"]');
    if (treffer) treffer.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function setEinlagernZiel(z) {
  dialog.ziel = z;
  render();
}
function setEinlagernLaenge(l) {
  dialog.laenge = l;
  render();
}
function setJahresuebersichtJahr(j) {
  dialog.jahr = j;
  render();
}
function setLieferungHolzart(h) {
  dialog.holzart = h;
  dialog.laenge = "25";
  dialog.preisEingabe = undefined;
  render();
}
function setLieferungLaenge(l) {
  dialog.laenge = l;
  render();
}

function bestaetigeEinlagern() {
  const v = parseFloat(document.getElementById("eingabe-menge").value.replace(",", "."));
  if (!Number.isFinite(v) || v <= 0) return;
  holzEinlagern(v, dialog.ziel || "hart", dialog.laenge || "25");
}
function bestaetigePreis() {
  const v = parseFloat(document.getElementById("eingabe-preis").value.replace(",", "."));
  if (!Number.isFinite(v) || v < 0) return;
  state[dialog.feld] = round2(v);
  dialog = null;
  speichern();
}
function bestaetigeKunde() {
  const name = document.getElementById("k-name").value.trim();
  if (!name) return;
  const telefon = document.getElementById("k-telefon").value.trim();
  const adresse = document.getElementById("k-adresse").value.trim();
  kundeHinzufuegen(name, telefon, adresse);
}
function kundeLoeschenBestaetigen(id) {
  if (confirm("Kunde wirklich löschen? Lieferungen bleiben im Bestand erhalten.")) {
    kundeLoeschen(id);
  }
}
function bestaetigeLieferung() {
  const kundeId = document.getElementById("l-kunde").value;
  const holzart = dialog.holzart || "hart";
  const laenge = dialog.laenge || "25";
  const menge = parseFloat(document.getElementById("l-menge").value.replace(",", "."));
  const preis = parseFloat(document.getElementById("l-preis").value.replace(",", "."));
  const lieferpreisRoh = document.getElementById("l-lieferpreis").value.trim();
  const lieferpreis = lieferpreisRoh === "" ? 0 : parseFloat(lieferpreisRoh.replace(",", "."));
  const datum = document.getElementById("l-datum").value;
  if (!kundeId || !Number.isFinite(menge) || menge <= 0 || !Number.isFinite(preis) || preis <= 0 || !Number.isFinite(lieferpreis) || lieferpreis < 0 || !datum) return;
  if (dialog.bearbeitenId) {
    lieferungAktualisieren(dialog.bearbeitenId, kundeId, holzart, laenge, menge, preis, lieferpreis, datum);
  } else {
    lieferungHinzufuegen(kundeId, holzart, laenge, menge, preis, lieferpreis, datum);
  }
}

function lieferungBearbeiten(id) {
  const l = state.lieferungen.find((x) => x.id === id);
  if (!l) return;
  openDialog({
    type: "lieferung",
    bearbeitenId: id,
    kundeId: l.kundeId,
    holzart: l.holzart,
    laenge: l.laenge,
    mengeEingabe: String(l.menge).replace(".", ","),
    preisEingabe: String(l.preisProM3).replace(".", ","),
    lieferpreisEingabe: l.lieferpreis > 0 ? String(l.lieferpreis).replace(".", ",") : "",
    datumEingabe: l.datum,
  });
}

render();
</script>
